<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plexa Companion</title><link rel="stylesheet" href="desktop.css"></head><body>
<header><button id="drag" aria-label="Drag window">⠿ Plexa</button><button id="settings" aria-label="Desktop settings">⚙</button><button id="hide" aria-label="Minimise to menu bar">−</button></header>
<section id="account"><p id="connection" role="status">Sign in with your Plexa account.</p><button id="login">Sign in with browser</button><button id="logout" hidden>Sign out</button></section>
<section id="preferences" hidden><label><input id="top" type="checkbox" checked> Always on top</label><label><input id="start" type="checkbox"> Start minimised</label><label><input id="autostart" type="checkbox"> Launch at login</label><label><input id="notifications" type="checkbox"> Private task notifications</label><label>Studio project ID (optional)<input id="project" maxlength="150" placeholder="Select by project ID"></label><p>Project access is checked by Plexa when you send a message.</p><button id="studio">Open Studio</button></section>
<script src="desktop.js"></script><script src="agents/companion.js"></script></body></html>
