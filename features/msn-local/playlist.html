<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playlist · Plexa</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f6f7fb;color:#202236}header{display:flex;justify-content:space-between;align-items:center;padding:24px 36px;background:white;border-bottom:1px solid #e1e4ee}h1{font-size:30px;margin:0}p{color:#6c7285;line-height:1.6}main{padding:32px;max-width:1100px;margin:auto}section{background:white;border:1px solid #e1e4ee;border-radius:16px;padding:22px;margin:18px 0}h2{margin:0 0 8px;font-size:20px}button{font:inherit;cursor:pointer;border:1px solid #dce0eb;border-radius:12px;background:white;color:inherit;padding:8px 12px;white-space:nowrap}button:hover{border-color:#6b55dd}button:focus-visible{outline:3px solid #a99afa;outline-offset:3px}button:disabled{cursor:default;opacity:.55}.list{display:grid;margin-top:14px}.item{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 16px;align-items:center;padding:14px 0;border-top:1px solid #e7eaf2}.item .copy{min-width:min(100%,240px);flex:1 1 240px}.item strong{display:block;line-height:1.35}.item small{color:#6c7285}.actions{display:flex;gap:8px;flex-wrap:nowrap;flex-shrink:0;margin-left:auto}.actions .danger{color:#9b2335}.dark .actions .danger{color:#ffb4c0}.dark{background:#131722;color:#ececf4}.dark header,.dark section,.dark button{background:#202636;color:#ececf4;border-color:#41495d}.dark p,.dark small{color:#b0b8ca}#notice{min-height:24px}@media(max-width:980px){main,header{padding:18px}h1{font-size:24px}}@media(max-width:720px){.actions{flex-wrap:wrap;width:100%;margin-left:0}}
</style><header><div><h1>Playlist</h1><p>The order here is the order in the public player catalogue. The first video plays, then the next.</p></div></header><main>
<p id="notice" role="status"></p>
<div id="lists"></div>
</main>
<script>
const $=id=>document.getElementById(id);
async function post(url,body){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Could not update the playlist');return data;}
function row(title,meta,actions){const item=document.createElement('div');item.className='item';const copy=document.createElement('div');copy.className='copy';const name=document.createElement('strong');name.textContent=title;const small=document.createElement('small');small.textContent=meta;copy.append(name,small);const buttons=document.createElement('div');buttons.className='actions';for(const [label,action,disabled,tone] of actions){const button=document.createElement('button');button.type='button';button.textContent=label;if(tone)button.classList.add(tone);button.disabled=disabled;button.onclick=action;buttons.append(button);}item.append(copy,buttons);return item;}
async function change(body,message){try{await post('/api/'+(body.route||'playlists')+'/'+body.action,body);$('notice').textContent=message;await load();}catch(e){$('notice').textContent=e.message;}}
async function load(){
 const data=await fetch('/api/playlists').then(r=>r.json());
 const host=$('lists');host.replaceChildren();
 const playlists=data.playlists||[];
 const studios=data.studioPlaylists||[];if(!playlists.length&&!studios.length){host.append('No playlist yet. Create one from Videos.');}for(const playlist of studios){const section=document.createElement('section');const heading=document.createElement('h2');heading.textContent=playlist.title;const note=document.createElement('p');note.textContent=(playlist.jobIds.length||'No')+' videos'+(playlist.brand?' · '+playlist.brand:'')+' · Studio playlist. This does not publish the videos.';section.append(heading,note);const list=document.createElement('div');list.className='list';playlist.jobIds.forEach((jobId,index)=>{const video=(data.finished||[]).find(item=>item.jobId===jobId);list.append(row(video?.title||'Unavailable video',(index+1)+' of '+playlist.jobIds.length,[['Up',()=>change({action:'move',playlistId:playlist.id,jobId,direction:'up',route:'studio-playlists'},'Playlist order updated.'),index===0],['Down',()=>change({action:'move',playlistId:playlist.id,jobId,direction:'down',route:'studio-playlists'},'Playlist order updated.'),index===playlist.jobIds.length-1],['Remove',()=>{if(!confirm('Remove this video from the playlist?'))return;change({action:'remove',playlistId:playlist.id,jobId,route:'studio-playlists'},(video?.title||'Video')+' removed from the playlist.');},false]]));});section.append(list);host.append(section);}if(!playlists.length)return;
 for(const playlist of playlists){const section=document.createElement('section');const heading=document.createElement('h2');heading.textContent=playlist.title;const note=document.createElement('p');note.textContent=playlist.videoIds.length?(playlist.videoIds.length+' videos · '+playlist.destinationId):'No videos in this playlist yet. Use Add to Playlist on a published video.';section.append(heading,note);const list=document.createElement('div');list.className='list';playlist.videoIds.forEach((id,index)=>{const video=(data.videos||[]).find(v=>v.id===id);const title=video?.title||'Unavailable video';list.append(row(title,(index+1)+' of '+playlist.videoIds.length,[['Up',()=>change({action:'move',playlistId:playlist.id,videoId:id,direction:'up'},'Playlist order updated.'),index===0],['Down',()=>change({action:'move',playlistId:playlist.id,videoId:id,direction:'down'},'Playlist order updated.'),index===playlist.videoIds.length-1],['Remove',()=>{if(!confirm('Remove "'+title+'" from the playlist?'))return;change({action:'remove',playlistId:playlist.id,videoId:id},title+' removed from the playlist.');},false,'danger']]));});section.append(list);host.append(section);}
}
load().catch(e=>{$('notice').textContent=e.message;});
</script><script src="/studio-navigation.js"></script></html>
