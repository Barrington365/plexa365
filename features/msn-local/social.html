<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social · Plexa</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f6f7fb;color:#202236}header{display:flex;justify-content:space-between;align-items:center;padding:24px 36px;background:white;border-bottom:1px solid #e1e4ee}h1{font-size:30px;margin:0}p{color:#6c7285;line-height:1.6}main{padding:32px;max-width:1500px;margin:auto}button,input{font:inherit}button{cursor:pointer;border:1px solid #dce0eb;border-radius:12px;background:white;color:inherit;padding:12px 18px}button:hover{border-color:#6b55dd}button:focus-visible,input:focus-visible{outline:3px solid #a99afa;outline-offset:3px}.search{width:100%;padding:16px;border:1px solid #dce0eb;border-radius:14px;background:white;color:inherit}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.tabs button{border-radius:30px}.tabs button[aria-pressed=true]{background:#eeeaff;color:#6341c8;border-color:#8b6bf2}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 20px}.card{text-align:left;padding:0;border:0;background:none}.art{height:180px;background:#eaeef4;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.device{width:154px;height:100px;background:white;border:5px solid white;border-radius:9px;box-shadow:7px 7px 0 #ccd2dc;padding:8px;display:flex;flex-direction:column;justify-content:space-between}.vertical .device{width:83px;height:146px}.square .device{width:118px;height:118px}.screen{background:linear-gradient(130deg,#09233c,#523ba3);color:white;flex:1;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;overflow:hidden;border-radius:3px}.screen:before{content:'';position:absolute;width:130px;height:130px;border:12px solid #22d7dd55;transform:rotate(35deg);left:25px}.screen span{z-index:1}.device small{font-size:8px;font-weight:800;letter-spacing:1px;padding-bottom:5px;color:#35334e}.card strong{display:block;font-size:15px}.card p{font-size:12px;margin:6px 0}.status{font-size:11px;background:#ede9fc;color:#624bc6;border-radius:20px;padding:3px 8px;display:inline-block}dialog{width:min(510px,94vw);border:1px solid #ddd;border-radius:18px;padding:28px;background:white;color:inherit}dialog::backdrop{background:#10152788}label{display:block;margin:18px 0}label input{display:block;padding:12px;width:100%;margin-top:8px;border:1px solid #ccc;border-radius:9px}.primary{background:#6454d9;color:white}.row{display:flex;gap:10px;justify-content:space-between}.dark{background:#131722;color:#ececf4}.dark header,.dark button,.dark input,.dark dialog{background:#202636;color:#ececf4;border-color:#41495d}.dark .art{background:#252e40}.dark p{color:#b0b8ca}body.dark .local-navigation nav a{color:#c6ccdc}body.dark .local-navigation nav a[aria-current]{color:#4b389a;background:#eeeaff}.dark .primary{background:#6454d9}#notice{min-height:24px}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px}header{padding:18px;gap:12px}h1{font-size:24px}.art{height:155px}.device{width:110px}}
</style><header><div><h1>Social</h1><p>Templates for posts. Video, text and images, sized for each platform.</p></div><button id="theme">Dark mode</button></header><main><input class="search" id="search" aria-label="Search formats" placeholder="What would you like to create?"><div class="tabs" id="kinds" aria-label="Template type"></div><div class="tabs" id="tabs" aria-label="Platforms"></div><h2 id="heading">Popular</h2><p id="intro">Choose a template to open it in the editor. Adding and editing a video on its own is in Video.</p><div class="grid" id="grid"></div><p id="notice" role="status"></p></main><dialog id="setup" aria-labelledby="setup-title"><h2 id="setup-title">Create post</h2><p id="size"></p><label>Title<input id="title" maxlength="100" value="Untitled post"></label><p id="setup-note"></p><div class="row"><button id="cancel">Cancel</button><button id="create" class="primary">Open editor</button></div><p id="error" role="alert"></p></dialog><script>
const $=id=>document.getElementById(id), platforms=['Popular','Facebook','Instagram','LinkedIn','Pinterest','TikTok','X / Twitter','WhatsApp','YouTube'], kinds=['All','Video','Text','Image'];
let platform='Popular', kind='All', chosen;
const data=[];
function add(p,n,kind,shape){data.push({p,n,kind,shape,w:shape==='vertical'?1080:1080,h:shape==='vertical'?1920:shape==='square'?1080:1080});if(shape==='landscape'){data.at(-1).w=1920;data.at(-1).h=1080;}}
const groups={Facebook:['Post','Post (Landscape)','Post (Square)','Event Cover','Cover (Landscape)','Story','Video','Ad','Profile Picture','Story Ad'],Instagram:['Post (4:5)','Post (3:4)','Post (Square)','Reel','Profile Picture','Ad (4:5)','Feed Ad','Story','Story Ad'],LinkedIn:['Post','Video','Background Photo','Single Image Ad','Profile Picture','Article Cover Image','Carousel','Video Ad'],Pinterest:['Carousel Ad','Pin (2:3)','Pin (9:16)','Video Ad (Square)','Static Ad'],TikTok:['Video','Story','Profile Picture','Photo Mode (Portrait)','Photo Mode (Square)'],'X / Twitter':['Post','Header','Video','Ad','Profile Picture (Square)'],WhatsApp:['Status','Post (Portrait)','Post (Landscape)','Post (Square)','Card (Portrait)'],YouTube:['Shorts','Thumbnail','Video','Banner','Channel Logo','Display Ad','Profile Picture','Ad (Landscape)','Ad (Portrait)','Video Chapter','Livestream Video']};
function kindFor(p,n){const video=/Video|Reel|Shorts/.test(n)&&!/Chapter|Livestream/.test(n)||p==='TikTok'&&n==='Story'||p==='YouTube'&&/^Ad/.test(n);if(video)return 'video';if(/Picture|Photo|Cover|Banner|Logo|Thumbnail|Pin|Image|Header|Carousel/.test(n))return 'image';return 'text';}
function shapeFor(p,n){return /Shorts|Reel|Story|Portrait|Status|9:16|4:5|3:4|2:3/.test(n)||p==='TikTok'&&n==='Video'?'vertical':/Square|Profile|Logo/.test(n)?'square':'landscape';}
for(const[p,names]of Object.entries(groups))for(const n of names)add(p,n,kindFor(p,n),shapeFor(p,n));
const marks={video:'▶',text:'T',image:'▧'}, labels={video:'Video',text:'Text',image:'Image'};
const notes={video:'This opens a video scene at the platform size. Add the video in the editor.',text:'This opens a text layout at the platform size. The headline and post copy are ready to edit.',image:'This opens an image frame at the platform size. Choose a Library image in the editor.'};
function render(){const q=$('search').value.toLowerCase();$('heading').textContent=platform;$('grid').replaceChildren();const list=data.filter(a=>(kind==='All'||a.kind===kind.toLowerCase())&&(platform==='Popular'?a.kind==='video'||['Thumbnail','Post (4:5)','Cover (Landscape)','Post','Story'].includes(a.n):a.p===platform)&&(`${a.p} ${a.n}`).toLowerCase().includes(q));for(const a of list){const b=document.createElement('button');b.className='card';b.innerHTML=`<div class="art ${a.shape}"><div class="device"><small>PLEXA · ${a.p}</small><div class="screen"><span>${marks[a.kind]}</span></div></div></div><strong>${a.p} ${a.n}</strong><p>${a.w} × ${a.h} px · ${labels[a.kind]}</p><span class="status">Build ${labels[a.kind].toLowerCase()}</span>`;b.onclick=()=>{chosen=a;$('setup-title').textContent=a.p+' '+a.n;$('size').textContent=a.w+' × '+a.h+' pixels · '+labels[a.kind]+' · '+(a.shape==='vertical'?'9:16':a.shape==='square'?'1:1':'16:9');$('setup-note').textContent=notes[a.kind];$('title').value=a.kind==='video'?'Untitled video':'Untitled post';$('error').textContent='';$('setup').showModal()};$('grid').append(b)}if(!list.length)$('grid').textContent='No formats match your search.';for(const b of $('tabs').children)b.setAttribute('aria-pressed',b.textContent===platform);for(const b of $('kinds').children)b.setAttribute('aria-pressed',b.textContent===kind)}
for(const name of kinds){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{kind=name;$('notice').textContent='';render()};$('kinds').append(b)}
for(const p of platforms){const b=document.createElement('button');b.textContent=p;b.onclick=()=>{platform=p;$('notice').textContent='';render()};$('tabs').append(b)}
$('search').oninput=render;$('cancel').onclick=()=>$('setup').close();
$('create').onclick=async()=>{if(!$('title').value.trim()){$('error').textContent='Enter a title.';return}$('create').disabled=true;try{const res=await fetch('/api/projects/social',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value.trim(),width:chosen.w,height:chosen.h,kind:chosen.kind})});const p=await res.json();if(!res.ok)throw Error(p.error||'Could not create project');location.href='/studio?project='+encodeURIComponent(p.id)}catch(e){$('error').textContent=e.message;$('create').disabled=false}};
$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Light mode':'Dark mode'};render();
</script><script src="/studio-navigation.js"></script></html>
