<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import saved Studio workspace</title><style>body{font:16px system-ui;background:#f4f5f8;color:#202236;padding:40px}main{max-width:760px;margin:auto;background:white;padding:32px;border-radius:16px}button,input{font:inherit;padding:12px}p{line-height:1.6}progress{width:100%}</style></head><body><main><h1>Import saved Studio workspace</h1><p>Bring across the prepared projects and media. Existing live records are preserved. Conflicting records stop the import for review.</p><label>Prepared manifest and media files <input id="files" type="file" multiple></label><p><button id="start">Upload and verify workspace</button></p><progress id="progress" value="0" max="100"></progress><p id="status" role="status">Choose the verified migration package.</p><a href="/workspace/projects">Open Studio projects</a><script>
const files=document.getElementById('files'),button=document.getElementById('start'),status=document.getElementById('status'),progress=document.getElementById('progress');
button.onclick=async()=>{button.disabled=true;try{const chosen=[...files.files],manifests=chosen.filter(f=>/^[a-f0-9]{64}\.json$/.test(f.name));if(manifests.length!==1)throw Error('Choose exactly one prepared manifest with its media chunks');const manifestFile=manifests[0],manifest=JSON.parse(await manifestFile.text()),id=manifestFile.name.slice(0,-5),required=new Map(manifest.files.flatMap(f=>f.chunks.map(c=>[c.sha256,c])));const sources=new Map(chosen.map(f=>[f.name,f]));for(const sha of required.keys())if(!sources.has(sha))throw Error('The package is missing media file '+sha);let count=0;for(const [sha,chunk]of required){status.textContent='Uploading and checking media '+(count+1)+' of '+required.size;const response=await fetch('/api/studio-workspace/chunk',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:await sources.get(sha).arrayBuffer()});const result=await response.json();if(!response.ok||result.chunk?.sha256!==sha||result.chunk?.bytes!==chunk.bytes)throw Error(result.error||'Uploaded media did not match');progress.value=++count/required.size*90;}const response=await fetch('/api/studio-workspace/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({manifest,id})});const job=await response.json();if(!response.ok)throw Error(job.error||'Import could not start');status.textContent='Uploaded. Verifying all files before making projects available…';for(let attempt=0;attempt<450;attempt++){await new Promise(resolve=>setTimeout(resolve,2000));const r=await fetch('/api/studio-workspace/state');if(!r.ok)throw Error('Import status unavailable; check before retrying');const state=await r.json(),current=state.jobs.find(j=>j.id===job.id);if(current?.status==='complete'){progress.value=100;status.textContent='Workspace imported and verified. '+(current.result?.projects||0)+' projects available.';return;}if(['failed','cancelled'].includes(current?.status))throw Error(current.stage);}throw Error('Verification is taking longer than expected. Check job status before retrying.');}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};
</script></main></body></html>
