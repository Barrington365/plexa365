<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image editor · Plexa</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f6fa;color:#182434;font:15px system-ui}
  header{padding:18px 28px;background:#fff;border-bottom:1px solid #dce2e9;display:flex;justify-content:space-between;gap:16px;align-items:center}
  a{color:#5545bd}
  main{max-width:1100px;margin:auto;padding:28px}
  h1{margin:0 0 8px;font-size:32px;letter-spacing:-.5px}
  p{line-height:1.5;color:#586779}
  .layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,340px);gap:20px}
  .panel{background:#fff;border:1px solid #dce2e9;border-radius:16px;padding:18px}
  .stage{min-height:360px;display:grid;place-items:center;background:#edf1f6;border-radius:12px}
  .stage img{max-width:100%;max-height:520px;object-fit:contain}
  label{display:grid;gap:6px;font-size:13px;color:#334155;margin:12px 0}
  input[type="range"]{width:100%}
  .row{display:flex;flex-wrap:wrap;gap:8px}
  button{font:inherit;border:1px solid #dce2e9;background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
  button.primary{background:#5545bd;color:#fff;border-color:#5545bd}
  button:disabled{opacity:.5;cursor:default}
  #status{min-height:1.4em}
  .error{color:#a33140}
  @media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
<header>
  <strong>plexa. Image editor</strong>
  <a id="back" href="/studio">Back to project</a>
</header>
<main>
  <p>IMAGE EDITOR · LOCAL</p>
  <h1>Edit this image</h1>
  <p id="context">Adjust the preview, then apply it to this layer. The original file stays in the Library.</p>
  <div class="layout">
    <section class="panel">
      <div class="stage"><img id="preview" alt="Edited image preview"></div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="panel" aria-label="Image adjustments">
      <div class="row">
        <button id="rotate-left" type="button">Rotate left</button>
        <button id="rotate-right" type="button">Rotate right</button>
        <button id="flip-x" type="button">Flip horizontal</button>
        <button id="flip-y" type="button">Flip vertical</button>
      </div>
      <label>Brightness <output id="brightness-value">0</output>
        <input id="brightness" type="range" min="-100" max="100" value="0">
      </label>
      <label>Contrast <output id="contrast-value">0</output>
        <input id="contrast" type="range" min="-100" max="100" value="0">
      </label>
      <p>Crop uses the rotated image, in pixels.</p>
      <div class="row">
        <label>Left<input id="crop-left" type="number" min="0" value="0"></label>
        <label>Top<input id="crop-top" type="number" min="0" value="0"></label>
        <label>Width<input id="crop-width" type="number" min="0" value="0"></label>
        <label>Height<input id="crop-height" type="number" min="0" value="0"></label>
      </div>
      <div class="row">
        <button id="clear-crop" type="button">Clear crop</button>
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <button id="reset" type="button">Restore original</button>
      </div>
      <div class="row">
        <button id="apply" class="primary" type="button">Apply to scene</button>
      </div>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const query=new URLSearchParams(location.search);
const projectId=query.get('project')||'';
const sceneId=query.get('scene')||'';
const layerId=query.get('layer')||'';
const asset=query.get('asset')||'';
const blank={rotate:0,flipX:false,flipY:false,brightness:0,contrast:0,crop:null};
let history=[structuredClone(blank)],index=0,timer=0,applying=false;
if(projectId)$('back').href='/studio?project='+encodeURIComponent(projectId);
else{$('back').href='/images';$('back').textContent='Back to images';$('apply').textContent='Save edited image';$('context').textContent='This saves an edited copy in the Library. It does not change a project until you choose the image for a layer.';}
if(!asset){$('status').textContent='Choose an image from a project or the Library.';$('status').className='error';$('apply').disabled=true;}
function current(){return history[index];}
function paint(){
  const ops=current();
  $('brightness').value=ops.brightness;$('contrast').value=ops.contrast;
  $('brightness-value').textContent=ops.brightness;$('contrast-value').textContent=ops.contrast;
  $('crop-left').value=ops.crop?.left||0;$('crop-top').value=ops.crop?.top||0;$('crop-width').value=ops.crop?.width||0;$('crop-height').value=ops.crop?.height||0;
  $('undo').disabled=index===0;$('redo').disabled=index===history.length-1;
}
function commit(ops){history=history.slice(0,index+1);history.push(ops);index++;paint();schedule();}
function changed(patch){commit({...current(),...patch});}
function cropFromFields(){
  const width=Number($('crop-width').value),height=Number($('crop-height').value);
  if(!width||!height)return null;
  return {left:Number($('crop-left').value)||0,top:Number($('crop-top').value)||0,width,height};
}
function schedule(){clearTimeout(timer);timer=setTimeout(loadPreview,180);}
async function loadPreview(){
  if(!asset)return;
  const ops=current();
  $('status').textContent='Updating preview…';$('status').className='';
  try{
    const response=await fetch('/api/images/preview',{method:'POST',headers:{'Content-Type':'application/json',Origin:location.origin},body:JSON.stringify({asset,...ops})});
    if(!response.ok){const body=await response.json();throw Error(body.error||'Preview failed');}
    const blob=await response.blob();
    const url=URL.createObjectURL(blob);
    const previous=$('preview').src;
    $('preview').src=url;
    if(previous.startsWith('blob:'))URL.revokeObjectURL(previous);
    $('status').textContent='Preview only. Apply saves a new image and leaves the original in place.';
  }catch(error){$('status').textContent=error.message;$('status').className='error';}
}
$('rotate-left').onclick=()=>changed({rotate:(current().rotate+270)%360});
$('rotate-right').onclick=()=>changed({rotate:(current().rotate+90)%360});
$('flip-x').onclick=()=>changed({flipX:!current().flipX});
$('flip-y').onclick=()=>changed({flipY:!current().flipY});
$('brightness').oninput=()=>{$('brightness-value').textContent=$('brightness').value;};
$('contrast').oninput=()=>{$('contrast-value').textContent=$('contrast').value;};
$('brightness').onchange=()=>changed({brightness:Number($('brightness').value)});
$('contrast').onchange=()=>changed({contrast:Number($('contrast').value)});
for(const id of ['crop-left','crop-top','crop-width','crop-height'])$(id).onchange=()=>changed({crop:cropFromFields()});
$('clear-crop').onclick=()=>changed({crop:null});
$('undo').onclick=()=>{if(index){index--;paint();schedule();}};
$('redo').onclick=()=>{if(index<history.length-1){index++;paint();schedule();}};
$('reset').onclick=()=>commit(structuredClone(blank));
$('apply').onclick=async()=>{
  if(applying||!asset)return;
  applying=true;$('apply').disabled=true;
  const ops=current();
  const untouched=ops.rotate===0&&!ops.flipX&&!ops.flipY&&ops.brightness===0&&ops.contrast===0&&!ops.crop;
  try{
    if(untouched&&projectId){
      const restored=await fetch('/api/projects/assign-layer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectId,sceneId,layerId,asset})});
      const body=await restored.json();
      if(!restored.ok)throw Error(body.error||'The layer was not restored');
      $('status').textContent='Original restored on this layer. Saved '+body.updatedAt+' UTC.';
      return;
    }
    const response=await fetch('/api/images/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({asset,...ops,projectId,sceneId,layerId})});
    const body=await response.json();
    if(!response.ok)throw Error(body.error||'The edit was not saved');
    if(!body.image?.updatedAt)throw Error('The edit was saved without an update time');
    $('status').textContent=(projectId?'Applied to this layer. ':'Saved to the Library. ')+'Updated '+body.image.updatedAt+' UTC.';
    if(projectId)setTimeout(()=>{location.href='/studio?project='+encodeURIComponent(projectId);},700);
  }catch(error){$('status').textContent=error.message;$('status').className='error';}
  finally{applying=false;$('apply').disabled=false;}
};
paint();
if(asset)loadPreview();
</script>
