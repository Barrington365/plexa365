<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace · Plexa</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:15px system-ui;color:#202236;background:#f4f5f8}header{padding:24px 30px;background:white;border-bottom:1px solid #e4e5ec}main{max-width:1200px;margin:auto;padding:32px}h1{font-size:34px;margin:0 0 10px}p{color:#637083;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:18px}.card{background:white;border:1px solid #e4e5ec;border-radius:12px;padding:22px;display:flex;flex-direction:column;align-items:start}.card h2{font-size:18px;margin:0}.card a{margin-top:auto}.notice{padding:18px;background:#eeebff;border-radius:10px;margin:24px 0}.sections{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.sections a[aria-current]{background:#6453cf;color:white}.tag{color:#77643c;font-size:13px}a:focus-visible{outline:3px solid #806de4;outline-offset:3px}body.dark{background:#151923;color:#eef1fa}body.dark header,body.dark .card{background:#202637;border-color:#465063}body.dark p{color:#bfc9d9}body.dark .notice{background:#302c47}button{padding:10px;border:1px solid #aab3c4;border-radius:8px;cursor:pointer}header{display:flex;justify-content:space-between}.page-identity{padding:24px;border-radius:14px;margin-bottom:22px;border-left:5px solid #6453cf;background:#eeebff}.page-identity small{display:block;font-weight:750;letter-spacing:.12em;margin-bottom:8px}.page-identity p{margin-bottom:0}body[data-section="admin"] .page-identity{background:#e5f3ed;border-color:#23805c}body[data-section="admin"] .cards{grid-template-columns:repeat(2,minmax(0,1fr))}body[data-section="settings"] .cards{grid-template-columns:1fr}body[data-section="settings"] .card{display:grid;grid-template-columns:220px 1fr auto;align-items:center;gap:18px}body[data-section="settings"] .card p{margin:0}body.dark .page-identity,body.dark[data-section="admin"] .page-identity{background:#283b39}body.dark[data-section="settings"] .page-identity{background:#302c47}@media(max-width:1000px){body[data-section="settings"] .card{grid-template-columns:1fr}body[data-section="admin"] .cards{grid-template-columns:1fr}}</style></head><body><header><strong>Planet Sport Studio</strong><button id="theme">Toggle theme</button></header><main><div class="page-identity"><small id="section-label">WORKSPACE</small><h1 id="heading"></h1><p id="intro"></p></div><nav class="sections" aria-label="Workspace sections"></nav><p class="notice">Local navigation hub. “Open in live Studio” opens the existing website in a new tab using its normal sign-in and permissions. These shortcuts do not connect live services to the local builder or change production settings.</p><label id="directory-search" hidden>Find a studio or feature<input id="feature-search" type="search" placeholder="Search studios, audio, imports, tools…" style="display:block;width:100%;padding:12px;margin:10px 0 24px;border:1px solid #aab3c4;border-radius:8px;font:inherit"></label><p id="search-empty" hidden>No matching features.</p><div class="cards"></div></main><script>
const groups={"admin": {"title": "Admin", "intro": "People, production agents and editorial safeguards.", "items": [["Agents", "Bob & Fiddle remain inactive. The local held queue is available; production control integration is pending.", "/articles", "Local held queue"], ["Users & permissions", "Manage existing staff accounts and access.", "/admin/users-and-permissions"], ["Guard Rails", "Editorial and production safeguards.", "/guard-rails"], ["Admin dashboard", "Existing platform administration.", "/admin"]]}, "tools": {"title": "Tools", "intro": "Day-to-day editorial production and planning.", "items": [["Match Reports", "Create and manage match reports.", "/match-report-builder/reports"], ["Schedule Studio", "Plan editorial output.", "/editing-studio"], ["Live Control", "Existing live production controls.", "/live"], ["Tools catalogue", "Browse existing Studio tools.", "/tools"], ["News Shorts manual", "Instructions for the existing video workflow.", "/docs/news-shorts-manual"]]}, "settings": {"title": "Settings", "intro": "Workspace preferences, brand guidance and product help.", "items": [["Configure", "Existing workspace configuration.", "/configure"], ["Brand Guidelines", "Brand standards and guidance.", "/brand-guidelines"], ["Brand kits", "Local logos, colours and reusable brand assets.", "/brand-kits", "Open local brand kits"], ["Theme & display", "Existing platform appearance settings.", "/admin/theme-and-display"], ["Product", "Platform overview.", "/product"], ["How It Works", "Workflow guidance.", "/how-it-works"], ["Knowledge Base", "Help and reference material.", "/knowledge-base"], ["Privacy Policy", "Privacy information.", "/privacy-policy"], ["Terms", "Platform terms.", "/terms"], ["Use Policy", "Acceptable use guidance.", "/use-policy"]]}, "development": {"title": "Development", "intro": "Feeds, APIs, prompts, import schedules and diagnostics.", "items": [["Integrations & API keys", "Existing provider keys and platform services.", "/admin/provider-keys-and-platform-services"], ["Imports", "Existing Language Studio import configuration.", "/language-studio?tab=Imports"], ["Crons & schedules", "Existing scheduled jobs and import runs.", "/admin/crons"], ["Article automations", "Existing rewrite and translation configuration.", "/admin/article-automations"], ["Prompts", "Existing prompt configuration.", "/prompts"], ["R&D & reports", "Development assessments and diagnostics.", "/admin/reports"], ["MRSS publishing", "Feed integration and production release are still pending. No live delivery is enabled here.", null]]}, "studios": {"title": "All Studio", "intro": "Every existing Studio remains available. Choose a format, then work through source, preview and export.", "items": [["MSN Video Builder", "Local scene editor and reusable templates.", "/studio", "Open local builder"], ["Shorts Studio", "Video & social \u00b7 existing short-form templates.", "/templates"], ["Landscape Studio", "Video & social \u00b7 landscape production.", "/landscape"], ["News Shorts (Planet Sport)", "Video & social \u00b7 existing article-to-video workflow.", "/news-shorts"], ["Article Studio", "Editorial & language \u00b7 existing article workflow.", "/article-studio"], ["Data Studio", "Editorial & language \u00b7 data-led content.", "/data-studio"], ["Match Report Builder", "Editorial & language \u00b7 create a match report.", "/match-report-builder"], ["Match Reports", "Editorial & language \u00b7 browse existing reports.", "/match-report-builder/reports"], ["Language Studio", "Editorial & language \u00b7 translation and imports.", "/language-studio"], ["Podcast Studio", "Audio \u00b7 existing podcast templates.", "/podcast-template"], ["Audio Studio", "Audio \u00b7 existing audio production tools.", "/audio-studio"], ["Ask Plexa", "Assistant \u00b7 opens the existing assistant.", "/ask-plexa/popout"], ["Library", "Existing live builds and media. Separate from local review assets.", "/library"], ["Local Library", "Local video builds, images, audio and brand assets.", "/library", "Open local Library"], ["Schedule Studio", "Scheduling \u00b7 existing Schedule Studio page.", "/editing-studio"], ["Live Control / Deploy", "Existing live control page; availability remains governed by the live platform.", "/live"], ["Configure", "Workspace configuration.", "/configure"], ["Knowledge Base", "Help and reference material.", "/knowledge-base"], ["Tools", "Existing utility catalogue.", "/tools"], ["Integrations", "Provider keys and platform services.", "/admin/provider-keys-and-platform-services"], ["Plexa Dev Gateway", "Development utilities.", "/dev-gateway"], ["R&D", "Development reports and diagnostics.", "/admin/reports"]]}};
const current=location.pathname.slice(1),group=groups[current]||groups.settings;document.body.dataset.section=current;document.getElementById('section-label').textContent=current==='admin'?'PLATFORM MANAGEMENT':current==='settings'?'WORKSPACE PREFERENCES':'WORKSPACE';document.title=group.title+' · Plexa';document.getElementById('heading').textContent=group.title;document.getElementById('intro').textContent=group.intro;
for(const [key,g] of Object.entries(groups)){const a=document.createElement('a');a.href='/'+key;a.textContent=g.title;if(key===current)a.setAttribute('aria-current','page');document.querySelector('.sections').append(a);}
for(const [title,description,url,localLabel] of group.items){const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=description;card.append(h,p);if(url){const a=document.createElement('a');a.href=localLabel?url:'https://planetsport.studio'+url;a.textContent=localLabel||'Open '+title+' ↗';if(!localLabel){a.target='_blank';a.rel='noopener';}card.append(a);}else{const s=document.createElement('span');s.className='tag';s.textContent='Not connected';card.append(s);}document.querySelector('.cards').append(card);}
if(current==='studios'){document.getElementById('directory-search').hidden=false;document.getElementById('feature-search').oninput=e=>{let count=0;document.querySelectorAll('.card').forEach(c=>{c.hidden=!c.textContent.toLowerCase().includes(e.target.value.toLowerCase());if(!c.hidden)count++;});document.getElementById('search-empty').hidden=!!count;};}
if(localStorage.getItem('plexa-theme')==='dark')document.body.classList.add('dark');document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('plexa-theme',document.body.classList.contains('dark')?'dark':'light');};
</script><script src="/studio-navigation.js"></script></body></html>
